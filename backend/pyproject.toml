[project]
name = "redactpdf-backend"
version = "0.1.0"
requires-python = ">=3.10"
# Pinned to the versions the test suite + CI are validated against.
# Bump deliberately (especially pymupdf, which drives redaction behaviour),
# then re-run `ruff check . && pytest`.
dependencies = [
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "pymupdf==1.26.7",
  "python-multipart==0.0.22",
  "phonenumbers==9.0.22",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "ruff==0.14.14",
  "reportlab==4.4.9",
  "pypdf==6.6.2",
]

[tool.pytest.ini_options]
markers = [
    "unit: tests unitaires purs (rapides)",
    "integration: tests avec PDF, I/O, libs externes",
    "e2e: tests bout-en-bout (API + UI)",
    "slow: tests lents (>1s ou lourds)",
]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
