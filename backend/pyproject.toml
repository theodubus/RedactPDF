[project]
name = "redactpdf-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pymupdf",
  "python-multipart",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "reportlab",
  "pypdf",
]

[tool.pytest.ini_options]
markers = [
    "unit: tests unitaires purs (rapides)",
    "integration: tests avec PDF, I/O, libs externes",
    "e2e: tests bout-en-bout (API + UI)",
    "slow: tests lents (>1s ou lourds)",
]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
