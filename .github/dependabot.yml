# Mises à jour des actions GitHub.
#
# Les workflows référencent des tags majeurs flottants (`@v7`). C'est le défaut
# recommandé par GitHub et c'est lisible, mais un tag peut être redéplacé : sur
# `release.yml`, qui détient le droit de publier sur PyPI par OIDC sans secret
# stocké, c'est le chemin de compromission le plus coûteux du dépôt.
#
# `release.yml` est donc épinglé par SHA complet depuis le 10 septembre 2026, avec
# la version d'origine en commentaire de fin de ligne : c'est elle que Dependabot
# lit pour proposer une montée. Épingler sans mécanisme de mise à jour serait une
# régression, des actions figées à la main cessant de recevoir leurs propres
# correctifs. Ce fichier est ce mécanisme, et ses pull requests sont faites pour
# être fusionnées, pas accumulées.
#
# Les workflows de CI restent volontairement sur des tags flottants : une action
# compromise y coûte un build rouge, pas un paquet publié.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
