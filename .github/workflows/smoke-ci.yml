name: smoke-ci

# Le binaire gelé n'est vérifié qu'au tag, par le workflow `release`. Ce job
# couvre en amont, sur chaque PR, la classe de régressions que `pytest` ne voit
# pas : launch.py, app/paths.py, le service de frontend/dist en same-origin et le
# chemin API complet de bout en bout. Il ne construit pas de bundle PyInstaller,
# donc il reste rapide.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the UI
        run: npm run build
        working-directory: frontend

      - name: Install the backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Smoke test the source launcher
        run: python scripts/smoke_test_app.py --source

  wheel:
    # La roue est le chemin d'installation recommandé sous macOS et pour
    # quiconque a Python. Sans ce job, elle ne serait vérifiée qu'au tag, alors
    # que ce qui la casse — redactpdf/paths.py, le lanceur, la mise en scène de
    # l'UI dans le paquet — se modifie dans des PR ordinaires.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev,wheel]"

      - name: Build the wheel
        run: python scripts/build_package.py

      - name: Install it into a clean environment and smoke test it
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet backend/dist/*.whl
          python scripts/smoke_test_app.py --exe /tmp/wheelcheck/bin/redactpdf
